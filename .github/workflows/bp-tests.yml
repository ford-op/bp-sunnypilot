# bp-sunnypilot: run tests.yaml on merges into the bp-sunnypilot branch too. Upstream's push trigger is
# `master` only, which this repo doesn't have; calling it keeps upstream's file unchanged there.
# The same file runs in BluePilotDev/bluepilot (full BluePilot), on merges into its work branches. Its bp-sunnypilot
# branch is a mirror of this repo's and runs no CI.
name: bp tests

on:
  push:
    branches:
      - bp-sunnypilot
      - bp-7.1-dev
      - bp-dev

jobs:
  tests:
    if: >-
      (github.repository == 'ford-op/bp-sunnypilot' && github.ref == 'refs/heads/bp-sunnypilot') ||
      (github.repository == 'BluePilotDev/bluepilot' && (github.ref == 'refs/heads/bp-7.1-dev' || github.ref == 'refs/heads/bp-dev'))
    permissions:
      contents: write  # BluePilotDev/bluepilot's process-replay publish step pushes with this token
    uses: ./.github/workflows/tests.yaml
    with:
      run_number: ${{ github.run_number }}
    secrets: inherit  # ford-op: the process-replay publish step pushes with the bluepilot-sync App
